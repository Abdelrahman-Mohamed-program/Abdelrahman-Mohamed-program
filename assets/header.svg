</g>
<text x="48" y="220" class="m in" font-size="15" xml:space="preserve" style="animation-delay:0.3s"><tspan fill="#2dd4bf">$</tspan> <tspan fill="#d1d5db">npm run start</tspan></text>
<text x="48" y="245" class="m in" font-size="15" xml:space="preserve" style="animation-delay:0.9s"><tspan fill="#a78bfa">[boot] </tspan> <tspan fill="#9ca3af">16 models · 85 endpoints · /api/v1</tspan></text>
<text x="48" y="270" class="m in" font-size="15" xml:space="preserve" style="animation-delay:1.4s"><tspan fill="#a78bfa">[db]   </tspan> <tspan fill="#9ca3af">mongodb connected</tspan> <tspan fill="#34d399">✓</tspan></text>
<text x="48" y="295" class="m in" font-size="15" xml:space="preserve" style="animation-delay:1.9s"><tspan fill="#a78bfa">[nginx]</tspan> <tspan fill="#9ca3af">reverse proxy up on :443</tspan> <tspan fill="#34d399">✓</tspan></text>
