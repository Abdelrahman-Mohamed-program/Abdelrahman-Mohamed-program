<text x="48" y="345" class="m in" font-size="15" xml:space="preserve" style="animation-delay:3.0s"><tspan fill="#5eead4">&gt;</tspan> <tspan fill="#d1d5db">listening. I build the part of the app you don't see.</tspan></text>
<g class="in" style="animation-delay:3s"><rect class="cursor" x="549.0" y="332" width="9" height="17" fill="#2dd4bf"/></g>
<g class="in" style="animation-delay:3.4s"><text x="700" y="230" class="m" font-size="12" fill="#6b7280">role</text>
