<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.in{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:14;opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.cursor{animation:blink 1s steps(1) infinite}
.ring{animation:pulse 1.8s ease-out infinite}
.flow{stroke-dasharray:6 6;animation:flow .9s linear infinite}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.cursor,.ring,.flow{animation:none}}
</style>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  
</defs>
<clipPath id="card"><rect width="1000" height="380" rx="18"/></clipPath>
<g clip-path="url(#card)">
<rect width="1000" height="380" fill="#0b1120"/>
<rect width="1000" height="380" fill="url(#grid)"/>
<circle cx="120.0" cy="20" r="160" fill="#14b8a6" opacity=".22" filter="url(#blur)"/>
<circle cx="920.0" cy="380" r="180" fill="#7c3aed" opacity=".22" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="999" height="379" rx="18" fill="none" stroke="#2dd4bf" stroke-opacity=".22"/>
<g>
  <circle cx="28" cy="26" r="6" fill="#ff5f57"/><circle cx="48" cy="26" r="6" fill="#febc2e"/><circle cx="68" cy="26" r="6" fill="#28c840"/>
  <text x="500.0" y="31" text-anchor="middle" class="m" font-size="13" fill="#6b7280">boody@cairo: ~/server</text>
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#1f2937"/>
</g>
<g transform="translate(48,84)">
  <rect width="104" height="104" rx="26.0" fill="url(#logo)"/>
  <rect x="1" y="1" width="102" height="102" rx="25.0" fill="none" stroke="#fff" stroke-opacity=".25"/>
  <text x="52.0" y="52.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="42.64" letter-spacing="1" fill="#fff">AM</text>
</g>
<text x="180" y="128" class="s" font-size="46" font-weight="800" letter-spacing="-1" fill="url(#brandH)">Abdelrahman Mohamed</text>
<text x="182" y="166" class="m" font-size="16" fill="#5eead4">backend dev  ·  co-founder @ Masr360  ·  Cairo</text>
