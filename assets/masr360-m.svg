<line x1="26" y1="373" x2="414" y2="373" stroke="#1f2937"/>
<text x="26" y="405" class="m" font-size="12" letter-spacing="2" fill="#6b7280">WHAT I OWN</text>
<g class="in" style="animation-delay:0.2s"><text x="26" y="435" class="m" font-size="14" fill="#2dd4bf">▸</text><text x="44" y="435" class="m" font-size="14" fill="#d1d5db">the game: missions, photo challenges</text></g>
<g class="in" style="animation-delay:0.3s"><text x="26" y="462" class="m" font-size="14" fill="#2dd4bf">▸</text><text x="44" y="462" class="m" font-size="14" fill="#d1d5db">products, from listing to cart to order</text></g>
<g class="in" style="animation-delay:0.4s"><text x="26" y="489" class="m" font-size="14" fill="#2dd4bf">▸</text><text x="44" y="489" class="m" font-size="14" fill="#d1d5db">places, governorates, how they connect</text></g>
<g class="in" style="animation-delay:0.5s"><text x="26" y="516" class="m" font-size="14" fill="#2dd4bf">▸</text><text x="44" y="516" class="m" font-size="14" fill="#d1d5db">nights, events and restaurants</text></g>
<g class="in" style="animation-delay:0.6s"><text x="26" y="543" class="m" font-size="14" fill="#2dd4bf">▸</text><text x="44" y="543" class="m" font-size="14" fill="#d1d5db">tickets and their pricing</text></g>
<g class="in" style="animation-delay:0.7s"><text x="26" y="570" class="m" font-size="14" fill="#2dd4bf">▸</text><text x="44" y="570" class="m" font-size="14" fill="#d1d5db">reviews and favourites on anything</text></g>
<g class="in" style="animation-delay:0.8s"><text x="26" y="597" class="m" font-size="14" fill="#2dd4bf">▸</text><text x="44" y="597" class="m" font-size="14" fill="#d1d5db">accounts: sign up, verify email, roles</text></g>
<g class="in" style="animation-delay:0.9s"><text x="26" y="624" class="m" font-size="14" fill="#2dd4bf">▸</text><text x="44" y="624" class="m" font-size="14" fill="#d1d5db">deploying it, keeping it up all night</text></g>
<line x1="26" y1="661" x2="414" y2="661" stroke="#1f2937"/>
<text x="26" y="693" class="m" font-size="12" letter-spacing="2" fill="#6b7280">HOW A REQUEST TRAVELS</text>
<g transform="translate(26,713)"><rect width="196" height="48" rx="10" fill="#111827" stroke="#9ca3af" stroke-opacity=".55"/>
<text x="12" y="21" class="m" font-size="13.5" font-weight="700" fill="#9ca3af">client</text>
<text x="12" y="38" class="m" font-size="10.5" fill="#6b7280">web · mobile app</text></g>
<g transform="translate(26,785)"><rect width="196" height="48" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity=".55"/>
<text x="12" y="21" class="m" font-size="13.5" font-weight="700" fill="#22d3ee">nginx :443</text>
