<g transform="translate(252,815)"><rect width="162" height="48" rx="10" fill="#111827" stroke="#a78bfa" stroke-opacity=".55"/>
<text x="12" y="21" class="m" font-size="13.5" font-weight="700" fill="#a78bfa">cloudinary</text>
<text x="12" y="38" class="m" font-size="10.5" fill="#6b7280">images</text></g>
<g transform="translate(252,899)"><rect width="162" height="48" rx="10" fill="#111827" stroke="#a78bfa" stroke-opacity=".55"/>
