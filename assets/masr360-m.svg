<path class="flow" d="M238 881 V923 H252" stroke="#a78bfa" stroke-width="2"/>
<line x1="26" y1="1007" x2="414" y2="1007" stroke="#1f2937"/>
<text x="26" y="1039" class="m" font-size="12.5" fill="#6b7280"><tspan fill="#a78bfa">also</tspan>  about.m360travel.com</text>
<text x="26" y="1067" class="s" font-size="15" fill="#9ca3af">The pre-launch site, built <tspan fill="#5eead4" font-weight="700">AI-directed</tspan>: I</text>
<text x="26" y="1089" class="s" font-size="15" fill="#9ca3af">wrote the brief, the product logic and every</text>
<text x="26" y="1111" class="s" font-size="15" fill="#9ca3af">flow, AI agents wrote the frontend, I reviewed</text>
<text x="26" y="1133" class="s" font-size="15" fill="#9ca3af">every detail. The backend is mine: waitlist,</text>
<text x="26" y="1155" class="s" font-size="15" fill="#9ca3af">game scoring, live leaderboard, share-to-earn.</text>
