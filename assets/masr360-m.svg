<text x="12" y="38" class="m" font-size="10.5" fill="#6b7280">IP whitelisted</text><text x="186" y="20" text-anchor="end" class="m" font-size="10" fill="#5eead4">mine</text></g>
<line class="flow" x1="124.0" y1="761" x2="124.0" y2="785" stroke="#2dd4bf" stroke-width="2"/>
