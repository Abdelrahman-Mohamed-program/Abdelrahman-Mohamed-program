<text x="12" y="38" class="m" font-size="10.5" fill="#6b7280">PM2 · Linux VPS</text><text x="186" y="20" text-anchor="end" class="m" font-size="10" fill="#5eead4">mine</text></g>
<g transform="translate(26,929)"><rect width="196" height="48" rx="10" fill="#111827" stroke="#34d399" stroke-opacity=".55"/>
