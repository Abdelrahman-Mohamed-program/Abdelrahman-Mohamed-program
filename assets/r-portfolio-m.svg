<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="226" viewBox="0 0 440 226" fill="none">
<style>
.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.in{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:14;opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.cursor{animation:blink 1s steps(1) infinite}
.ring{animation:pulse 1.8s ease-out infinite}
.flow{stroke-dasharray:6 6;animation:flow .9s linear infinite}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.cursor,.ring,.flow{animation:none}}
</style>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="am" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1fd2f2"/><stop offset=".45" stop-color="#3b82f6"/><stop offset="1" stop-color="#9333ea"/>
  </linearGradient>
  <linearGradient id="amEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7ee8fa"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="amGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  
</defs>
<clipPath id="card"><rect width="440" height="226" rx="18"/></clipPath>
<g clip-path="url(#card)">
<rect width="440" height="226" fill="#0b1120"/>
<rect width="440" height="226" fill="url(#grid)"/>

</g>
<rect x=".5" y=".5" width="439" height="225" rx="18" fill="none" stroke="#2dd4bf" stroke-opacity=".22"/>
<circle cx="440" cy="0" r="110" fill="#5eead4" opacity=".18" filter="url(#blur)"/>
<rect x="0" y="16" width="4" height="60" rx="2" fill="#5eead4"/>
<text x="26" y="38" class="m" font-size="12.5" fill="#6b7280">abdelrahman.tech</text>
<text x="26" y="72" class="s" font-size="25" font-weight="800" fill="#d1d5db">Portfolio</text>
<text x="26" y="96" class="m" font-size="12.5" fill="#5eead4">solo</text>
<text x="26" y="126" class="s" font-size="15.5" fill="#9ca3af">My site. AVIF/WebP image pipeline, code</text>
<text x="26" y="149" class="s" font-size="15.5" fill="#9ca3af">splitting, reduced-motion support.</text>
<g transform="translate(26,178)"><rect width="57.5" height="26" rx="13.0" fill="#5eead4" fill-opacity="0.08" stroke="#5eead4" stroke-opacity=".45"/>
<text x="28.75" y="13.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12.5" fill="#5eead4">React</text></g>
<g transform="translate(91.5,178)"><rect width="95.0" height="26" rx="13.0" fill="#5eead4" fill-opacity="0.08" stroke="#5eead4" stroke-opacity=".45"/>
<text x="47.5" y="13.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12.5" fill="#5eead4">TypeScript</text></g>
<g transform="translate(194.5,178)"><rect width="50.0" height="26" rx="13.0" fill="#5eead4" fill-opacity="0.08" stroke="#5eead4" stroke-opacity=".45"/>
<text x="25.0" y="13.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12.5" fill="#5eead4">Vite</text></g>
<text x="414" y="196" text-anchor="end" class="m" font-size="14" fill="#5eead4">open →</text>
</svg>