<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="140" viewBox="0 0 1000 140" fill="none">
<style>
.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.in{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:14;opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.cursor{animation:blink 1s steps(1) infinite}
.ring{animation:pulse 1.8s ease-out infinite}
.flow{stroke-dasharray:6 6;animation:flow .9s linear infinite}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.cursor,.ring,.flow{animation:none}}
</style>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="am" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1fd2f2"/><stop offset=".45" stop-color="#3b82f6"/><stop offset="1" stop-color="#9333ea"/>
  </linearGradient>
  <linearGradient id="amEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7ee8fa"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="amGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  
</defs>
<clipPath id="card"><rect width="1000" height="140" rx="18"/></clipPath>
<g clip-path="url(#card)">
<rect width="1000" height="140" fill="#0b1120"/>
<rect width="1000" height="140" fill="url(#grid)"/>

</g>
<rect x=".5" y=".5" width="999" height="139" rx="18" fill="none" stroke="#2dd4bf" stroke-opacity=".22"/>
<circle cx="1000" cy="70.0" r="110" fill="#a78bfa" opacity=".16" filter="url(#blur)"/>
<rect x="0" y="16" width="4" height="108" rx="2" fill="#a78bfa"/>
<text x="32" y="52" class="m" font-size="12.5" fill="#6b7280">travel booking system  ·  <tspan fill="#a78bfa">team lead · backend</tspan></text>
<text x="32" y="90" class="s" font-size="26" font-weight="800" fill="#d1d5db">Tavelsta</text>
<text x="390" y="50" class="s" font-size="15" fill="#9ca3af">Led a team of 7. Owned the backend: JWT,</text>
<text x="390" y="72" class="s" font-size="15" fill="#9ca3af">roles, validation, error handling.</text>
<g transform="translate(390,92)"><rect width="47.599999999999994" height="24" rx="12.0" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="23.799999999999997" y="12.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="11.5" fill="#a78bfa">Node</text></g>
<g transform="translate(445.6,92)"><rect width="68.3" height="24" rx="12.0" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="34.15" y="12.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="11.5" fill="#a78bfa">Express</text></g>
<g transform="translate(521.9,92)"><rect width="68.3" height="24" rx="12.0" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="34.15" y="12.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="11.5" fill="#a78bfa">MongoDB</text></g>
<text x="968" y="75.0" text-anchor="end" class="m" font-size="14" fill="#a78bfa">open →</text>
</svg>