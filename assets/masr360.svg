<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" fill="none">
<style>
.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.in{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:14;opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.cursor{animation:blink 1s steps(1) infinite}
.ring{animation:pulse 1.8s ease-out infinite}
.flow{stroke-dasharray:6 6;animation:flow .9s linear infinite}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.cursor,.ring,.flow{animation:none}}
</style>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="am" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1fd2f2"/><stop offset=".45" stop-color="#3b82f6"/><stop offset="1" stop-color="#9333ea"/>
  </linearGradient>
  <linearGradient id="amEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7ee8fa"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="amGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  
</defs>
<clipPath id="card"><rect width="1000" height="700" rx="18"/></clipPath>
<g clip-path="url(#card)">
<rect width="1000" height="700" fill="#0b1120"/>
<rect width="1000" height="700" fill="url(#grid)"/>
<circle cx="120.0" cy="20" r="160" fill="#14b8a6" opacity=".22" filter="url(#blur)"/>
<circle cx="920.0" cy="700" r="180" fill="#7c3aed" opacity=".22" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="999" height="699" rx="18" fill="none" stroke="#2dd4bf" stroke-opacity=".22"/>

<g transform="translate(40,40)">
  <rect width="118" height="26" rx="13" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/>
  <circle class="ring" cx="16" cy="13" r="5" fill="none" stroke="#34d399"/><circle cx="16" cy="13" r="4" fill="#34d399"/>
  <text x="28" y="18" class="m" font-size="12" font-weight="700" fill="#34d399">PRODUCTION</text>
  <text x="132" y="18" class="m" font-size="13" fill="#6b7280">m360travel.com  ·  since nov 2025</text>
</g>
<text x="40" y="118" class="s" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#brandH)">Masr360</text>
<text x="40" y="148" class="s" font-size="16" fill="#d1d5db">Egypt, but you play it. Explore governorates, places, nights and local crafts,</text>
<text x="40" y="170" class="s" font-size="16" fill="#d1d5db">then do missions and photo challenges to earn credits. I co-founded it and built the whole backend.</text>
<line x1="40" y1="196" x2="960" y2="196" stroke="#1f2937"/>
<text x="40" y="226" class="m" font-size="12" letter-spacing="2" fill="#6b7280">HOW A REQUEST TRAVELS</text>
<text x="520" y="226" class="m" font-size="12" letter-spacing="2" fill="#6b7280">WHAT I OWN</text>
<g transform="translate(40,246)"><rect width="200" height="50" rx="10" fill="#111827" stroke="#9ca3af" stroke-opacity=".55"/>
<text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#9ca3af">client</text>
<text x="14" y="39" class="m" font-size="11" fill="#6b7280">Next.js web · mobile app</text></g>
<g transform="translate(40,326)"><rect width="200" height="50" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity=".55"/>
<text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#22d3ee">nginx :443</text>
<text x="14" y="39" class="m" font-size="11" fill="#6b7280">HTTPS · reverse proxy</text><text x="190" y="20" text-anchor="end" class="m" font-size="10" fill="#5eead4">mine</text></g>
<g transform="translate(40,406)"><rect width="200" height="50" rx="10" fill="#111827" stroke="#2dd4bf" stroke-opacity=".55"/>
<text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#2dd4bf">express 5 API</text>
<text x="14" y="39" class="m" font-size="11" fill="#6b7280">PM2 · Linux VPS</text><text x="190" y="20" text-anchor="end" class="m" font-size="10" fill="#5eead4">mine</text></g>
<g transform="translate(40,486)"><rect width="200" height="50" rx="10" fill="#111827" stroke="#34d399" stroke-opacity=".55"/>
<text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#34d399">mongodb atlas</text>
<text x="14" y="39" class="m" font-size="11" fill="#6b7280">IP whitelisted</text><text x="190" y="20" text-anchor="end" class="m" font-size="10" fill="#5eead4">mine</text></g>
<line class="flow" x1="140.0" y1="296" x2="140.0" y2="326" stroke="#2dd4bf" stroke-width="2"/>
<line class="flow" x1="140.0" y1="376" x2="140.0" y2="406" stroke="#2dd4bf" stroke-width="2"/>
<line class="flow" x1="140.0" y1="456" x2="140.0" y2="486" stroke="#2dd4bf" stroke-width="2"/>
<g transform="translate(290,366)"><rect width="180" height="50" rx="10" fill="#111827" stroke="#a78bfa" stroke-opacity=".55"/>
<text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#a78bfa">cloudinary</text>
<text x="14" y="39" class="m" font-size="11" fill="#6b7280">multi-image upload</text></g>
<g transform="translate(290,446)"><rect width="180" height="50" rx="10" fill="#111827" stroke="#a78bfa" stroke-opacity=".55"/>
<text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#a78bfa">brevo / nodemailer</text>
<text x="14" y="39" class="m" font-size="11" fill="#6b7280">OTP + order emails</text></g>
<path class="flow" d="M240 431 H265 V391 H290" stroke="#a78bfa" stroke-width="2"/>
<path class="flow" d="M240 431 H265 V471 H290" stroke="#a78bfa" stroke-width="2"/>
<g class="in" style="animation-delay:0.2s"><text x="520" y="262" class="m" font-size="13.5" fill="#2dd4bf">▸</text><text x="540" y="262" class="m" font-size="13.5" fill="#d1d5db">the game: missions, photo challenges, credits</text></g>
<g class="in" style="animation-delay:0.32s"><text x="520" y="291" class="m" font-size="13.5" fill="#2dd4bf">▸</text><text x="540" y="291" class="m" font-size="13.5" fill="#d1d5db">products, from listing to cart to order</text></g>
<g class="in" style="animation-delay:0.44s"><text x="520" y="320" class="m" font-size="13.5" fill="#2dd4bf">▸</text><text x="540" y="320" class="m" font-size="13.5" fill="#d1d5db">places and governorates, and how they connect</text></g>
<g class="in" style="animation-delay:0.56s"><text x="520" y="349" class="m" font-size="13.5" fill="#2dd4bf">▸</text><text x="540" y="349" class="m" font-size="13.5" fill="#d1d5db">nights, events and restaurants</text></g>
<g class="in" style="animation-delay:0.6799999999999999s"><text x="520" y="378" class="m" font-size="13.5" fill="#2dd4bf">▸</text><text x="540" y="378" class="m" font-size="13.5" fill="#d1d5db">tickets and their pricing</text></g>
<g class="in" style="animation-delay:0.8s"><text x="520" y="407" class="m" font-size="13.5" fill="#2dd4bf">▸</text><text x="540" y="407" class="m" font-size="13.5" fill="#d1d5db">reviews and favourites on anything</text></g>
<g class="in" style="animation-delay:0.9199999999999999s"><text x="520" y="436" class="m" font-size="13.5" fill="#2dd4bf">▸</text><text x="540" y="436" class="m" font-size="13.5" fill="#d1d5db">accounts: sign up, email verification, roles</text></g>
<g class="in" style="animation-delay:1.04s"><text x="520" y="465" class="m" font-size="13.5" fill="#2dd4bf">▸</text><text x="540" y="465" class="m" font-size="13.5" fill="#d1d5db">deploying it and keeping it up in production</text></g>
<g transform="translate(612.0,40)"><rect width="348.0" height="28" rx="14.0" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity=".45"/>
<text x="174.0" y="14.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12" fill="#fbbf24">Top 20 · Huawei Spark Infinity N. Africa 2025</text></g>
<g transform="translate(705.6,76)"><rect width="254.39999999999998" height="28" rx="14.0" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity=".45"/>
<text x="127.19999999999999" y="14.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12" fill="#2dd4bf">Orange Corners Egypt · graduated</text></g>
<line x1="40" y1="566" x2="960" y2="566" stroke="#1f2937"/>
<text x="40" y="600" class="m" font-size="13" fill="#6b7280"><tspan fill="#a78bfa">also</tspan>  about.m360travel.com  ·  the pre-launch site</text>
<text x="40" y="630" class="s" font-size="15" fill="#9ca3af">Built <tspan fill="#5eead4" font-weight="700">AI-directed</tspan>: I wrote the brief, the product logic and every flow, AI agents wrote the frontend,</text>
<text x="40" y="652" class="s" font-size="15" fill="#9ca3af">I reviewed every detail. The backend is mine: waitlist, game scoring, live leaderboard, share-to-earn.</text>
<g transform="translate(669.6,584)"><rect width="290.4" height="28" rx="14.0" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity=".45"/>
<text x="145.2" y="14.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12" fill="#34d399">#1 on Google for "Masr360 pre-launch"</text></g>
</svg>