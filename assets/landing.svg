<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.in{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:14;opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.cursor{animation:blink 1s steps(1) infinite}
.ring{animation:pulse 1.8s ease-out infinite}
.flow{stroke-dasharray:6 6;animation:flow .9s linear infinite}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.cursor,.ring,.flow{animation:none}}
</style>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  
</defs>
<clipPath id="card"><rect width="1000" height="250" rx="18"/></clipPath>
<g clip-path="url(#card)">
<rect width="1000" height="250" fill="#0b1120"/>
<rect width="1000" height="250" fill="url(#grid)"/>
<circle cx="120.0" cy="20" r="160" fill="#14b8a6" opacity=".22" filter="url(#blur)"/>
<circle cx="920.0" cy="250" r="180" fill="#7c3aed" opacity=".22" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="999" height="249" rx="18" fill="none" stroke="#2dd4bf" stroke-opacity=".22"/>

<text x="40" y="52" class="m" font-size="13" fill="#6b7280">about.m360travel.com  ·  pre-launch  ·  jun to sep 2026</text>
<text x="40" y="90" class="s" font-size="26" font-weight="800" fill="#d1d5db">The pre-launch site, built the <tspan fill="url(#brandH)">AI-directed</tspan> way</text>
<text x="40" y="126" class="s" font-size="15" fill="#9ca3af">I wrote the brief, the product logic, the business model and every flow.</text>
<text x="40" y="148" class="s" font-size="15" fill="#9ca3af">AI agents wrote the frontend code. I reviewed and edited every detail.</text>
<text x="40" y="170" class="s" font-size="15" fill="#9ca3af">The backend is all mine: waitlist, game scoring, live leaderboard, share-to-earn credits.</text>
<g transform="translate(40,192)"><rect width="290.4" height="28" rx="14.0" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity=".45"/>
<text x="145.2" y="14.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12" fill="#34d399">#1 on Google for "Masr360 pre-launch"</text></g>
<g transform="translate(340.4,192)"><rect width="225.6" height="28" rx="14.0" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity=".45"/>
<text x="112.8" y="14.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12" fill="#2dd4bf">4 days build + 6 days polish</text></g>
<g transform="translate(576.0,192)"><rect width="175.2" height="28" rx="14.0" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="87.6" y="14.5" dominant-baseline="central" text-anchor="middle" class="m" font-size="12" fill="#a78bfa">20-step feedback game</text></g>
</svg>